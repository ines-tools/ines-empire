# source_entity_class:
#   target_entity_class_
#     source_feature:
#       source_method:
#         target_feature: target_method  (optionally target_method --> [target_method, list of dimension positions]

unit__to_node: 
  unit__outputNode: 
    ramp_method: 
      no_constraint: 
        ramp_method: 'none'
      ramp_limit: 
        ramp_method: 'ramp_limit'
      ramp_cost: 
        ramp_method: 'ramp_cost'
      ramp_limit_and_cost: 
        ramp_method: 'both'
  unit__node__profile:
    profile_method:
      upper_limit: 
        profile_method: [upper_limit, [1, 2, 1]]
      lower_limit: 
        profile_method: [lower_limit, [1, 2, 1]]
      fixed:
        profile_method: [fixed, [1, 2, 1]]
      no_profile: 
        profile_method: [no_profile, [1, 2, 1]]
Generator:
  unit__to_node:
    ramp_method: 
      no_constraint: 
        ramp_method: 'none'
      ramp_limit: 
        ramp_method: 'ramp_limit'
      ramp_cost: 
        ramp_method: 'ramp_cost'
      ramp_limit_and_cost: 
        ramp_method: 'both'
    RampRate:
      target: [ramp_method, 1, [[1]]]
      for_each: [Node, [[1], [1]]]
      operation: constant
      with: 'ramp_limit'
      suppress_warnings: True
Storage:
  node:
    StorageInitialEnergyLevel:
      target: [storage_state_fix_method, 1, [[1]]]
      for_each: [Node, [[1]]]
      operation: constant
      with: 'fix_start'
      suppress_warnings: True